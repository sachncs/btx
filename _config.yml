# GitHub Pages is deployed by site/.github/workflows/deploy-site.yml. This
# exclusion keeps the legacy branch-based Jekyll builder from interpreting
# Astro source files as YAML front matter when GitHub runs its dynamic check.
exclude:
  - site
  - btx
  - tests
  - docs
  - scripts
  - todo
  - .venv
  - dist
  - uv.lock
