<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1216"/>
      <stop offset="100%" stop-color="#060a0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ce2c8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fd0a4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5fd0a4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="900" cy="200" r="300" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Curve motif on right -->
  <g transform="translate(900 315)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M -200 0 C -140 -120, -60 -120, 0 0 S 140 120, 200 0"/>
    <path d="M -200 60 C -140 -60, -60 -60, 0 60 S 140 180, 200 60" opacity="0.5"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80 240)">
    <rect width="72" height="72" rx="16" fill="#5fd0a4"/>
    <g transform="translate(36 42)" fill="none" stroke="#0c1216" stroke-width="3" stroke-linecap="round">
      <path d="M -22 0 C -15 -16, -8 -16, 0 0 S 15 16, 22 0"/>
      <path d="M -22 8 C -15 -8, -8 -8, 0 8 S 15 24, 22 8" opacity="0.5"/>
    </g>
    <text x="36" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="14" fill="#0c1216">btx</text>
  </g>

  <!-- Text -->
  <text x="80" y="400" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="84" fill="#ffffff" letter-spacing="-2">
    btx
  </text>
  <text x="80" y="455" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="36" fill="#9aacb3" letter-spacing="-1">
    The Bitcoin stack, parsed at the byte.
  </text>
  <text x="80" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="20" fill="#5fd0a4">
    pip install btx
  </text>

  <!-- URL -->
  <text x="1120" y="580" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="18" fill="#6b818a">
    sachncs.github.io/btx
  </text>
</svg>