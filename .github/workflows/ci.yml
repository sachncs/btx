name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - run: uv sync --extra dev --frozen
      - name: Check formatting with ruff
        run: uv run ruff format --check btx/ tests/
      - run: uv run ruff check btx/ tests/
      - run: uv run mypy btx/
      - run: uv run mypy tests/ --ignore-missing-imports
      - name: Audit dependencies for known CVEs
        run: uv run pip-audit

  test:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - run: uv sync --extra dev --frozen
      - run: uv run pytest tests/ -v --cov=btx --cov-report=term-missing --cov-fail-under=90

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: "3.13"
      - run: uv sync --extra dev --frozen
      - run: uv run pytest tests/test_benchmarks.py --benchmark-only --benchmark-json benchmark.json
      - name: Store benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: benchmark
          path: benchmark.json
      - name: Check benchmark baseline
        id: baseline
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No gh-pages benchmark baseline exists; comparison will be skipped."
          fi
      - name: Compare benchmarks to main
        if: steps.baseline.outputs.available == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: true


  test-coincurve:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    strategy:
      matrix:
        # coincurve 21 currently does not build on Python 3.14. The core
        # package still runs on 3.14 through its pure-Python backend.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: "coincurve-${{ matrix.python-version }}"
      - run: uv sync --extra dev --extra coincurve --frozen
      - run: uv run pytest tests/ -v --cov=btx --cov-report=term-missing --cov-fail-under=90

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Check site
        working-directory: site
        run: npm run check
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Verify site content
        working-directory: site
        run: npm run verify
      - name: Verify Pages fallback
        run: test -f site/dist/index.html && cp site/dist/index.html site/dist/404.html
