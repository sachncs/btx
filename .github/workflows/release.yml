name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
        type: string
      publish:
        description: "Publish the verified artifacts to TestPyPI and PyPI"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pip-audit
      - run: uv run pytest tests/ -v --cov=btx --cov-fail-under=90
      - run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      - name: Attest build provenance
        uses: actions/attest-build-provenance@5e7ba389a13f57ec1bed2403c76479015929390b  # v2
        with:
          subject-path: dist/**
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
